<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IPTV Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    background: black;
}
</style>

</head>
<body>

<video
    id="player"
    autoplay
    muted
    controls>
</video>

<script>
const player = document.getElementById("player");

player.src = "udp://239.255.0.9:1234";

console.log("Loading stream");

player.addEventListener("error", function(e){
    console.log("Video error", e);
});
</script>

</body>
</html>
