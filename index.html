<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB</title>

<style>
html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}

#iptv-wrapper {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}

#player {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    background: transparent;
}
</style>
</head>

<body>

<div id="iptv-wrapper">

    <video
        id="player"
        hwz="z-index:-1"
        autoplay
        muted
        preferredcaptions="pid=1720;lang=cat">
    </video>

</div>

<script>
const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

player.src = STREAM_URL;

function forceCaptions() {
    try {
        for (let i = 0; i < player.textTracks.length; i++) {
            player.textTracks[i].mode = "showing";
        }
    } catch(e) {
        console.log(e);
    }
}

player.addEventListener("loadedmetadata", function () {
    forceCaptions();
    player.play();
});

player.addEventListener("playing", function () {
    forceCaptions();
});

player.addEventListener("error", function (e) {
    console.log("video error", e);
});

setTimeout(forceCaptions, 3000);
setTimeout(forceCaptions, 6000);
setTimeout(forceCaptions, 10000);
setTimeout(forceCaptions, 15000);

setInterval(forceCaptions, 5000);

player.play();
</script>

</body>
</html>
