<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB Diagnostics</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#iptvzone {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
}
</style>
</head>

<body>

<div id="iptvzone">

<video
    id="player"
    hwz="off"
    autoplay
    controls
    preferredcaptions="pid=1720;lang=cat">
</video>

</div>

<script>

const STREAM_URL = "udp://239.255.0.15:1234";

const player = document.getElementById("player");

player.src = STREAM_URL;

function forceTracks() {

    try {

        for (let i = 0; i < player.textTracks.length; i++) {

            player.textTracks[i].mode = "showing";

        }

    } catch(e) {

        console.log(e);

    }

}

setTimeout(forceTracks, 5000);
setTimeout(forceTracks, 10000);
setTimeout(forceTracks, 15000);

setInterval(forceTracks, 10000);

player.play();

</script>

</body>
</html>
