<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB Diagnostics</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: -1;
}
</style>
</head>

<body>

<video
    id="player"
    style="z-index:-1;"
    hwz="z-index:-1"
    autoplay
    preferredcaptions="pid=1720;lang=cat">
</video>

<script>

const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

player.src = STREAM_URL;

player.addEventListener("loadedmetadata", () => {
    console.log("metadata loaded");
});

player.addEventListener("playing", () => {
    console.log("playing");
});

player.addEventListener("error", (e) => {
    console.log("video error", e);
});

player.play();

</script>

</body>
</html>
