<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB Diagnostics</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
    background: black;
    object-fit: contain;
}
</style>
</head>

<body>

<video
    id="player"
    autoplay
    controls
    preferredcaptions="pid=1735;lang=cat">
</video>

<script>

const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

function log(msg) {
    console.log(new Date().toISOString() + " | " + msg);
}

log("========================================");
log("HSJD IPTV DVB SUBTITLE TEST");
log("UserAgent: " + navigator.userAgent);
log("Stream: " + STREAM_URL);
log("========================================");

player.src = STREAM_URL;

// Eventos principales

[
    "loadstart",
    "loadedmetadata",
    "loadeddata",
    "canplay",
    "canplaythrough",
    "play",
    "playing",
    "pause",
    "waiting",
    "stalled",
    "ended",
    "error"
].forEach(evt => {

    player.addEventListener(evt, function(e) {

        log(
            "EVENT: " + evt +
            " | readyState=" + player.readyState +
            " | currentTime=" + player.currentTime
        );

        if (evt === "error" && player.error) {
            log(
                "MEDIA ERROR => code=" +
                player.error.code
            );
        }

    });

});

function dumpTracks() {

    log("========== TRACK DUMP ==========");

    try {

        if (player.audioTracks) {

            log("audioTracks.length = " +
                player.audioTracks.length);

            for (let i = 0; i < player.audioTracks.length; i++) {

                let t = player.audioTracks[i];

                log(
                    "AUDIO[" + i + "]" +
                    " enabled=" + t.enabled +
                    " language=" + t.language +
                    " label=" + t.label
                );
            }

        } else {

            log("audioTracks API not available");
        }

    } catch(err) {

        log("audioTracks exception: " + err);
    }

    try {

        if (player.videoTracks) {

            log("videoTracks.length = " +
                player.videoTracks.length);

            for (let i = 0; i < player.videoTracks.length; i++) {

                let t = player.videoTracks[i];

                log(
                    "VIDEO[" + i + "]" +
                    " selected=" + t.selected +
                    " label=" + t.label
                );
            }

        } else {

            log("videoTracks API not available");
        }

    } catch(err) {

        log("videoTracks exception: " + err);
    }

    try {

        log(
            "textTracks.length = " +
            player.textTracks.length
        );

        for (let i = 0; i < player.textTracks.length; i++) {

            let t = player.textTracks[i];

            log(
                "TEXT[" + i + "]" +
                " language=" + t.language +
                " kind=" + t.kind +
                " label=" + t.label +
                " mode=" + t.mode
            );

           try {

    t.mode = "showing";

    if (typeof t.enabled !== "undefined") {
        t.enabled = true;
    }

    log(
        "TEXT[" + i + "] mode changed to showing"
    );

    player.dispatchEvent(
        new Event("resize")
    );

} catch(e) {
                log(
                    "TEXT[" + i + "] activation failed: " + e
                );
            }
        }

    } catch(err) {

        log("textTracks exception: " + err);
    }

    log("================================");
}

// Escaneos periódicos

setTimeout(dumpTracks, 5000);
setTimeout(dumpTracks, 10000);
setTimeout(dumpTracks, 20000);

setInterval(dumpTracks, 30000);

// Estado periódico

setInterval(() => {

    log(
        "STATE" +
        " readyState=" + player.readyState +
        " currentTime=" + player.currentTime +
        " paused=" + player.paused
    );

}, 10000);

// Arranque

player.play()
.then(() => {
    log("play() OK");
})
.catch(err => {
    log("play() FAILED: " + err);
});

</script>

</body>
</html>
