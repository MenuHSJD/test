<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IPTV DVB Subtitle Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    background: black;
    object-fit: contain;
}
</style>

</head>
<body>

<video
    id="player"
    autoplay
    controls
    preferredcaptions="pid=1735">
</video>

<script>

const player = document.getElementById("player");

player.src = "udp://239.255.0.9:1234";

console.log("Loading stream:", player.src);

player.addEventListener("loadedmetadata", function () {
    console.log("Metadata loaded");
});

player.addEventListener("playing", function () {
    console.log("Playback started");
});

player.addEventListener("error", function (e) {
    console.log("Video error:", e);
});

/* Fuerza continuamente los subtítulos */

setInterval(() => {

    try {

        for (let i = 0; i < player.textTracks.length; i++) {

            console.log(
                "Track",
                i,
                player.textTracks[i].language,
                player.textTracks[i].kind
            );

            player.textTracks[i].mode = "showing";
        }

    } catch(err) {

        console.log(err);

    }

}, 2000);

</script>

</body>
</html>
