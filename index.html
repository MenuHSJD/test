<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB</title>

<style>
html, body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;
}

#iptvzone {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;
}

#player {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    background: white;
    overflow: hidden;
}

/* Estilo de subtítulos */
#player::cue {
    color: yellow;
    background: rgba(0, 0, 0, 0.85);

    font-size: 4.2vh;
    line-height: 1.1;

    font-family: Arial, sans-serif;
    font-weight: bold;
}

#player::-webkit-media-text-track-container {
    position: absolute !important;

    left: 0 !important;
    top: 0 !important;

    width: 100% !important;
    height: 100% !important;

    overflow: hidden !important;

    transform: none !important;
}

#player::-webkit-media-text-track-display {
    max-width: 92% !important;
    margin-left: auto !important;
    margin-right: auto !important;

    font-size: 4.2vh !important;
    line-height: 1.1 !important;
}
</style>
</head>

<body>

<div id="iptvzone">

    <video
        id="player"
        hwz="off"
        autoplay
        muted
        preferredcaptions="pid=1720;lang=cat">
    </video>

</div>

<script>
const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

player.src = STREAM_URL;

function forceCaptions() {
    try {
        for (let i = 0; i < player.textTracks.length; i++) {
            player.textTracks[i].mode = "showing";
        }
    } catch(e) {
        console.log(e);
    }
}

player.addEventListener("loadedmetadata", function () {
    forceCaptions();
    player.play();
});

player.addEventListener("playing", function () {
    forceCaptions();
});

player.addEventListener("error", function (e) {
    console.log("video error", e);
});

setTimeout(forceCaptions, 3000);
setTimeout(forceCaptions, 6000);
setTimeout(forceCaptions, 10000);
setTimeout(forceCaptions, 15000);

setInterval(forceCaptions, 5000);

player.play();
</script>

</body>
</html>
