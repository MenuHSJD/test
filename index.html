<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB Diagnostics</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#player {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<div hwz="z-index:-1">

<video
    id="player"
    hwz="z-index:-2"
    autoplay
    preferredcaptions="pid=1720;lang=cat">
</video>

</div>

<script>

const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

player.src = STREAM_URL;

player.play();

</script>

</body>
</html>
