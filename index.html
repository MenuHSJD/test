<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HSJD IPTV DVB Diagnostics</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
    background: black;
    object-fit: contain;
}
</style>

</head>

<body>

<video
    id="player"
    hwz="z-index:-1"
    autoplay
    controls
    preferredcaptions="pid=1720;lang=cat">
</video>

<script>

const STREAM_URL = "udp://239.255.0.15:1234";
const player = document.getElementById("player");

player.src = STREAM_URL;

function dumpTracks() {

    console.log(
        "textTracks.length = " +
        player.textTracks.length
    );

    for (let i = 0; i < player.textTracks.length; i++) {

        const t = player.textTracks[i];

        console.log(
            "TEXT[" + i + "]" +
            " language=" + t.language +
            " kind=" + t.kind +
            " label=" + t.label +
            " mode=" + t.mode
        );

        try {
            t.mode = "showing";
        }
        catch(e) {
            console.log(e);
        }
    }
}

setTimeout(dumpTracks, 5000);
setTimeout(dumpTracks, 10000);
setTimeout(dumpTracks, 20000);

setInterval(dumpTracks, 30000);

player.play();

</script>

</body>
</html>
